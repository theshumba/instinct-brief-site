<script>
const D=JSON.parse(document.getElementById('data').textContent);const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(p){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:310000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
document.getElementById('lock').remove();document.getElementById('page').innerHTML=h;localStorage.setItem('brief-pass',p);}
const saved=localStorage.getItem('brief-pass');if(saved)open(saved).catch(()=>localStorage.removeItem('brief-pass'));
document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('err').textContent='Opening...';open(document.getElementById('p').value.trim()).catch(()=>{document.getElementById('err').textContent='That passphrase did not work.';});};
</script></body></html>
